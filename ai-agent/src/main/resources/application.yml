server:
  port: 8080

spring:
  application:
    name: ai-agent

  # H2 in-memory database — no PostgreSQL needed for dev
  datasource:
    url: jdbc:h2:mem:agentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # creates tables on start, drops on stop
    show-sql: false

  # H2 web console — access at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

# Agent / OpenAI config
agent:
  # Set your OpenAI API key here or via environment variable:
  #   export OPENAI_API_KEY=sk-...
  # Leave as default to run in keyword/stub mode (no key needed)
  openai-api-key: ${OPENAI_API_KEY:your-api-key-here}
  model: gpt-4o-mini
  max-history: 10

  # JWT config
  jwt:
    secret: ${JWT_SECRET:agentSecretKey12345678901234567890123456789012}
    expiration: 86400000   # 24 hours in milliseconds

logging:
  level:
    com.eyeapss.aiagent: DEBUG
    org.springframework.security: WARN
